<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fef9ef">
  <meta name="color-scheme" content="light">
  <meta name="description" content="情绪药店：一间不出售感冒药的药店。六位客人，多次来访，数封信。">
  <title>情绪药店 · Emotion Pharmacy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fef9ef'/%3E%3Crect x='4' y='4' width='24' height='24' fill='%23ff6b6b' stroke='%23000' stroke-width='3'/%3E%3Cpath d='M13 9h6v3c0 2 4 3 4 7v4c0 2-2 3-4 3h-6c-2 0-4-1-4-3v-4c0-4 4-5 4-7z' fill='%23fef9ef' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="stylesheet" href="css/medicine.css">
  <link rel="stylesheet" href="css/archive.css">
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <span class="bg-shape bg-shape--circle"></span>
    <span class="bg-shape bg-shape--tri"></span>
    <span class="bg-shape bg-shape--square"></span>
    <span class="bg-shape bg-shape--dots"></span>
    <svg class="bg-shape bg-shape--wave" viewBox="0 0 120 40" focusable="false">
      <path d="M4 28 Q 19 6 34 28 T 64 28 T 94 28 T 124 28" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="app">
    <header class="topbar">
      <button type="button" class="brand" data-action="home" aria-label="回到柜台">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 40" focusable="false">
            <rect x="11" y="2" width="10" height="6" fill="currentColor"/>
            <path d="M11 8 h10 v5 c0 4 6 6 6 14 v6 c0 3 -3 5 -6 5 h-10 c-3 0 -6 -2 -6 -5 v-6 c0 -8 6 -10 6 -14 z" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M7 24 h18" stroke="currentColor" stroke-width="3"/>
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">情绪药店</span>
          <span class="brand__sub">六位客人 · 数次来访</span>
        </span>
      </button>
      <div class="topbar__meta">
        <span class="pill" id="unread-pill" hidden></span>
        <span class="progress-label" id="progress-label">来访 0 / 10</span>
        <button type="button" class="icon-btn" data-action="restart" aria-label="重新开始" title="重新开始">↺</button>
        <button type="button" class="icon-btn" id="music-toggle" aria-label="背景音乐" title="背景音乐">
          <span id="music-icon">𝆕</span>
        </button>
      </div>
    </header>

    <main class="screens" id="screens">
      <section class="screen" data-screen="customer" aria-label="顾客"></section>
      <section class="screen" data-screen="medicine" aria-label="配药"></section>
      <section class="screen" data-screen="archive" aria-label="信件"></section>
    </main>

    <nav class="tabbar" aria-label="主要界面">
      <button type="button" class="tab is-active" data-nav="customer">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M5 20 c0 -4 3.2 -6.5 7 -6.5 s7 2.5 7 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="tab__label">顾客</span>
      </button>
      <button type="button" class="tab" data-nav="medicine">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M10 3 h4 v4 c0 2 4 3 4 7 v5 c0 2 -1.6 3 -3.6 3 h-4.8 C7.6 22 6 21 6 19 v-5 c0 -4 4 -5 4 -7 z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M7 15 h10" stroke="currentColor" stroke-width="3"/></svg>
        </span>
        <span class="tab__label">配药</span>
      </button>
      <button type="button" class="tab" data-nav="archive">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="3"/><path d="M3 8 l9 6 9 -6" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
        </span>
        <span class="tab__label">信件</span>
        <span class="tab__badge" data-badge="archive" aria-hidden="true"></span>
      </button>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript>
    <p style="padding:2rem;text-align:center;font-family:sans-serif;font-weight:900;">这间药店需要启用 JavaScript 才能开门。</p>
  </noscript>

  <script src="js/registry.js"></script>
  <script src="data/medicines.js"></script>
  <script src="data/characters.js"></script>
  <script src="data/queue.js"></script>
  <script src="data/events/event-001.js"></script>
  <script src="data/events/event-002.js"></script>
  <script src="data/events/event-003.js"></script>
  <script src="data/events/event-004.js"></script>
  <script src="data/events/event-005.js"></script>
  <script src="data/events/event-006.js"></script>
  <script src="data/events/event-007.js"></script>
  <script src="data/events/event-008.js"></script>
  <script src="data/events/event-009.js"></script>
  <script src="data/events/event-010.js"></script>
  <script src="data/letters/letter-001.js"></script>
  <script src="data/letters/letter-002.js"></script>
  <script src="data/letters/letter-003.js"></script>
  <script src="data/letters/letter-004.js"></script>
  <script src="data/letters/letter-005.js"></script>
  <script src="data/letters/letter-006.js"></script>
  <script src="data/letters/letter-007.js"></script>
  <script src="data/letters/letter-008.js"></script>
  <script src="data/letters/letter-009.js"></script>
  <script src="data/letters/letter-010.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/portrait.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/medicine.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
 <script src="js/music.js"></script>
</body>
</html>
